<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome</title>

<link rel="stylesheet" href="../css/welcome.css">
</head>

<body>

<div class="container">

    <h1 id="welcomeText">
        Welcome, <span id="username" contenteditable="true">User</span>
    </h1>

    <div id="incomeSection" class="hidden">

        <p class="subtitle">Select your income type</p>

        <div class="cards">

            <div class="card" data-type="daily">Daily</div>
            <div class="card" data-type="weekly">Weekly</div>
            <div class="card" data-type="monthly">Monthly</div>
            <div class="card" data-type="yearly">Yearly</div>

        </div>

    </div>

</div>

<script src="../js/welcome.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>
</html>
