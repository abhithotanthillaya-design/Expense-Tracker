<title>Weekly Tracker — Expense Tracker</title>
<meta name="theme-color" content="#08102d">

<link rel="stylesheet" href="../css/app.css">

<link rel="stylesheet" href="../css/period.css">
</head>
<body>
<header class="header">
<div class="top-actions"><button id="menuBtn" class="glass-btn" title="Open Menu">☰</button></div>
<h2 id="accountName">Personal Account</h2>
<p id="periodTitle">Weekly Tracker</p>
<p id="periodRange" class="period-range"></p>
</header>

<div id="menuPopup" class="home-menu hidden">
<!-- Managed by nav.js -->
<a href="dashboard.html">🏠 Dashboard</a>
<a href="transactions.html">💳 Transactions</a>
<a href="daily.html">📅 Daily</a>
<a href="weekly.html" class="active">📆 Weekly</a>
<a href="monthly.html">🗓 Monthly</a>
<a href="yearly.html">📊 Yearly</a>
<a href="analytics.html">📈 Analytics</a>
<a href="budgets.html">🎯 Budgets</a>

<a href="accounts.html">🏦 Accounts</a>

<div class="period-controls">
<button id="previousPeriod">← Previous Week</button>
<button id="nextPeriod">Next Week →</button>
</div>

<section class="summary">
<div class="summary-card"><h3>Income</h3><p id="incomeTotal">₹0</p></div>
<div class="summary-card"><h3>Expenses</h3><p id="expenseTotal">₹0</p></div>
<div class="summary-card balance"><h3>Balance</h3><p id="balanceTotal">₹0</p></div>
</section>

<section class="period-section">
<h3>Weekly Breakdown (Click day to inspect)</h3>
<div id="breakdownList" class="period-list"></div>
</section>

<section class="period-section">
<h3>Category Spending</h3>
<div id="categoryList" class="period-list"></div>
</section>

<script src="../js/storage.js"></script>
<script src="../js/category-utils.js"></script>
<script src="../js/period-utils.js"></script>
<script src="../js/ui-feedback.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/period-view.js"></script>
<script src="../js/weekly.js"></script>
</body>
