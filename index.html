<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- INTRO CSS -->
    <link rel="stylesheet" href="css/intro.css">
</head>
<body>

<!-- INTRO / SPLASH SCREEN -->
<div id="splash-screen" class="splash">

    <!-- YELLOW LIGHTNING GLOW -->
    <div class="lightning-glow"></div>
    <!-- LIGHTNING EFFECT LAYERS -->
    <div class="electric-wave"></div>
    <div class="gold-particles"></div>

    <!-- COINS : LEFT -->
    <div class="coins-area">
        <div class="coin c1">₹</div>
        <div class="coin c2">₹</div>
        <div class="coin c3">₹</div>
        <div class="coin c4">₹</div>
    </div>

    <!-- CASH : RIGHT -->
    <div class="cash-area">
        <div class="note n1"><span>₹</span></div>
        <div class="note n2"><span>₹</span></div>
        <div class="note n3"><span>₹</span></div>
        <div class="note n4"><span>₹</span></div>
    </div>

    <!-- BRAND CONTENT -->
    <div class="splash-content">

        <!-- TITLE -->
        <h1 class="app-title">
            <span class="shine">Expense Tracker</span>
        </h1>

        <!-- TAGLINE (AFTER 2-LINE GAP VIA CSS) -->
        <p class="tagline">Track. Save. Grow.</p>

        <!-- BY ATS CASH TAG -->
        <div class="byline-box">
            <span class="byline">By ATS</span>
        </div>

    </div>

</div>

<!-- INTRO JS (ONLY FOR CLEAN ANIMATION RESTART) -->
<script src="js/intro.js"></script>

</body>
</html>
